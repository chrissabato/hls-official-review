<div id="playerContainer" class="fixed inset-0 bg-black bg-opacity-90 z-50 flex justify-center items-center hidden" style="display: none;">

    <div class="flex flex-col w-screen h-screen bg-black rounded-none shadow-none p-0">

        <div class="relative flex-grow min-h-0">

            <button id="closeBtn" class="absolute top-4 right-4 bg-red-600 hover:bg-red-700 text-white p-2 rounded-full shadow-lg transition duration-150 focus:outline-none z-50" aria-label="Close video player">
                <svg class="w-8 h-8" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" viewBox="0 0 24 25" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.9" d="m15 9-6 6m0-6 6 6m6-3a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z"/>
                </svg>
            </button>

            <video id="videoPlayer" controls autoplay muted class="w-full h-full rounded-none bg-black"></video>
        </div>

        <div class="flex flex-wrap justify-center items-center gap-x-3 mb-2 w-full bg-black text-5xl">

            <button type="button" id="toggleFullscreenBtn" class="py-5 px-5 rounded-md text-base cursor-pointer transition-colors duration-300 bg-gray-600 text-white hover:bg-gray-700 font-semibold flex items-center justify-center gap-1 shadow-lg">
               <svg class="w-6 h-6 text-white" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" viewBox="0 0 24 24">
                   <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 4H4m0 0v4m0-4 5 5m7-5h4m0 0v4m0-4-5 5M8 20H4m0 0v-4m0 4 5-5m7 5h4m0 0v-4m0 4-5-5"/>
               </svg>
            </button>

            <div class="flex flex-wrap justify-center gap-3 p-2 bg-gray-800 rounded-md shadow-lg">
                <button class="rewind-btn py-3 px-3 rounded-md text-base cursor-pointer transition-colors duration-300 bg-blue-500 text-white hover:bg-blue-600 font-semibold flex items-center justify-center gap-1" data-seconds="60">
                    <svg class="w-4 h-4 text-white" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" viewBox="0 0 24 24">
                        <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m17 16-4-4 4-4m-6 8-4-4 4-4"/>
                    </svg>
                    60s
                </button>
                <button class="rewind-btn py-3 px-3  rounded-md text-base cursor-pointer transition-colors duration-300 bg-blue-500 text-white hover:bg-blue-600 font-semibold flex items-center justify-center gap-1" data-seconds="30">
                    <svg class="w-4 h-4 text-white" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" viewBox="0 0 24 24">
                        <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m17 16-4-4 4-4m-6 8-4-4 4-4"/>
                    </svg>
                    30s
                </button>
                <button class="rewind-btn py-3 px-3  rounded-md text-base cursor-pointer transition-colors duration-300 bg-blue-500 text-white hover:bg-blue-600 font-semibold flex items-center justify-center gap-1" data-seconds="10">
                    <svg class="w-4 h-4 text-white" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" viewBox="0 0 24 24">
                        <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m17 16-4-4 4-4m-6 8-4-4 4-4"/>
                    </svg>
                    10s
                </button>
                <button class="rewind-btn py-3 px-3  rounded-md text-base cursor-pointer transition-colors duration-300 bg-blue-500 text-white hover:bg-blue-600 font-semibold flex items-center justify-center gap-1" data-seconds="5">
                    <svg class="w-4 h-4 text-white" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" viewBox="0 0 24 24">
                        <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m17 16-4-4 4-4m-6 8-4-4 4-4"/>
                    </svg>
                    5s
                </button>
                <button class="rewind-btn py-3 px-3  rounded-md text-base cursor-pointer transition-colors duration-300 bg-blue-500 text-white hover:bg-blue-600 font-semibold flex items-center justify-center gap-1" data-seconds="1">
                    <svg class="w-4 h-4 text-white" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" viewBox="0 0 24 24">
                        <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m17 16-4-4 4-4m-6 8-4-4 4-4"/>
                    </svg>
                    1s
                </button>
                <button class="rewind-btn py-3 px-3  rounded-md text-base cursor-pointer transition-colors duration-300 bg-blue-500 text-white hover:bg-blue-600 font-semibold flex items-center justify-center gap-1" data-seconds="0.0333">
                    <svg class="w-4 h-4 text-white" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" viewBox="0 0 24 24">
                        <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m17 16-4-4 4-4m-6 8-4-4 4-4"/>
                    </svg>
                    1f
                </button>
            </div>

            <div class="flex flex-wrap justify-center gap-3 p-2 bg-gray-800 rounded-md shadow-lg">
                <button type="button" id="playPauseBtn" class="py-1 px-4  rounded-md text-base cursor-pointer transition-colors duration-300 bg-green-600 text-white hover:bg-green-700 font-semibold flex items-center justify-center gap-1 shadow-lg" aria-label="Play or Pause video">
                    <svg id="playIcon" class="w-6 h-6 hidden" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="currentColor" viewBox="0 0 24 24">
                        <path fill-rule="evenodd" d="M8.6 5.2A1 1 0 0 0 7 6v12a1 1 0 0 0 1.6.8l8-6a1 1 0 0 0 0-1.6l-8-6Z" clip-rule="evenodd"/>
                    </svg>
                    <svg id="pauseIcon" class="w-6 h-6" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="currentColor" viewBox="0 0 24 24">
                        <path fill-rule="evenodd" d="M8 5a1 1 0 0 0-1 1v12a1 1 0 1 0 2 0V6a1 1 0 0 0-1-1Zm7 0a1 1 0 0 0-1 1v12a1 1 0 1 0 2 0V6a1 1 0 0 0-1-1Z" clip-rule="evenodd"/>
                    </svg>
                    <span id="playPauseText"></span>
                </button>
                <button class="speed-btn py-3 px-3  rounded-md text-base cursor-pointer transition-colors duration-300 bg-blue-500 text-white hover:bg-blue-600 font-semibold" data-rate="0.1">0.1x</button>
                <button class="speed-btn py-3 px-3  rounded-md text-base cursor-pointer transition-colors duration-300 bg-blue-500 text-white hover:bg-blue-600 font-semibold" data-rate="0.25">0.25x</button>
                <button class="speed-btn py-3 px-3  rounded-md text-base cursor-pointer transition-colors duration-300 bg-blue-500 text-white hover:bg-blue-600 font-semibold" data-rate="0.5">0.5x</button>
                <button class="speed-btn py-3 px-3  rounded-md text-base cursor-pointer transition-colors duration-300 bg-fuchsia-600 text-white hover:bg-fuchsia-700 font-semibold" data-rate="1.0">1.0x</button>
            </div>

            <div class="flex flex-wrap justify-center gap-3 p-2 bg-gray-800 rounded-md shadow-lg">
                <button class="forward-btn py-3 px-3  rounded-md text-base cursor-pointer transition-colors duration-300 bg-blue-500 text-white hover:bg-blue-600 font-semibold flex items-center justify-center gap-1" data-seconds="0.0333">
                    1f
                    <svg class="w-4 h-4 text-white" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" viewBox="0 0 24 24">
                        <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m7 16 4-4-4-4m6 8 4-4-4-4"/>
                    </svg>
                </button>
                <button class="forward-btn py-3 px-3  rounded-md text-base cursor-pointer transition-colors duration-300 bg-blue-500 text-white hover:bg-blue-600 font-semibold flex items-center justify-center gap-1" data-seconds="1">
                    1s
                    <svg class="w-4 h-4 text-white" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" viewBox="0 0 24 24">
                        <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m7 16 4-4-4-4m6 8 4-4-4-4"/>
                    </svg>
                </button>
                <button class="forward-btn py-3 px-3  rounded-md text-base cursor-pointer transition-colors duration-300 bg-blue-500 text-white hover:bg-blue-600 font-semibold flex items-center justify-center gap-1" data-seconds="5">
                    5s
                    <svg class="w-4 h-4 text-white" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" viewBox="0 0 24 24">
                        <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m7 16 4-4-4-4m6 8 4-4-4-4"/>
                    </svg>
                </button>
                <button class="forward-btn py-3 px-3  rounded-md text-base cursor-pointer transition-colors duration-300 bg-blue-500 text-white hover:bg-blue-600 font-semibold flex items-center justify-center gap-1" data-seconds="10">
                    10s
                    <svg class="w-4 h-4 text-white" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" viewBox="0 0 24 24">
                        <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m7 16 4-4-4-4m6 8 4-4-4-4"/>
                    </svg>
                </button>
                <button class="forward-btn py-3 px-3  rounded-md text-base cursor-pointer transition-colors duration-300 bg-blue-500 text-white hover:bg-blue-600 font-semibold flex items-center justify-center gap-1" data-seconds="30">
                    30s
                    <svg class="w-4 h-4 text-white" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" viewBox="0 0 24 24">
                        <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m7 16 4-4-4-4m6 8 4-4-4-4"/>
                    </svg>
                </button>
                <button class="forward-btn py-3 px-3  rounded-md text-base cursor-pointer transition-colors duration-300 bg-blue-500 text-white hover:bg-blue-600 font-semibold flex items-center justify-center gap-1" data-seconds="60">
                    60s
                    <svg class="w-4 h-4 text-white" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" viewBox="0 0 24 24">
                        <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m7 16 4-4-4-4m6 8 4-4-4-4"/>
                    </svg>
                </button>
            </div>

            <button type="button" id="goToLiveBtn" class="py-5 px-5 rounded-md text-base cursor-pointer transition-colors duration-300 bg-red-600 text-white hover:bg-red-700 font-semibold flex items-center justify-center gap-1 shadow-lg">
                LIVE
                <svg class="w-6 h-6 text-white" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" viewBox="0 0 24 24">
                    <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 12H4m12 0-4 4m4-4-4-4m3-4h2a3 3 0 0 1 3 3v10a3 3 0 0 1-3 3h-2"/>
                </svg>
            </button>
        </div>
    </div>
